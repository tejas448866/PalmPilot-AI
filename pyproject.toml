[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hand-gesture-racing-controller"
version = "2.0.0.dev0"
description = "External webcam hand-gesture controller for browser racing games"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
dependencies = [
  "opencv-python>=4.8,<5",
  "mediapipe==0.10.21",
  "numpy>=1.24,<2.0",
  "pynput>=1.7.6,<2",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "PySide6>=6.7,<7",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
]

[project.scripts]
gesture-racing-controller = "src.main:main"
gesture-racing-gui = "src.gui.main_window:run_gui"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
